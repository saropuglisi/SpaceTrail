name: Verify packaged folder growth installers

on:
  push:
    branches: ['codex/verify-folder-growth-installers']

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify packaged Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify installer and folder growth
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SPACETRAIL_DEMO_FRAMES: ${{ runner.temp }}/spacetrail-demo
        run: |
          gh run download 46027186477 --name 'SpaceTrail-Setup-${{ matrix.arch }}' --dir dist/windows
          if ($LASTEXITCODE -ne 0) { throw 'The packaged installer could not be downloaded.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath 'dist/windows/SpaceTrail-Setup-${{ matrix.arch }}.exe' | Format-List
          .\Scripts\test-windows-package.ps1 -Architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SpaceTrail-Windows-demo-${{ matrix.arch }}-frames
          path: ${{ runner.temp }}/spacetrail-demo/*.png
