<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>SpaceTrail</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="SpaceTrail">
      <nav id="navigation" aria-label="Views"></nav>
      <div class="sidebar-bottom">
        <div class="sidebar-drive" id="sidebar-drive" hidden></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="toolbar" aria-label="SpaceTrail toolbar">
        <div class="toolbar-group" id="history-actions"></div>
        <div class="brand"><img src="../assets/spacetrail.png" alt="" width="23" height="23"><span>SpaceTrail</span></div>
        <div class="toolbar-group toolbar-end">
          <button class="square" id="search-button" type="button" aria-label="Search disks" title="Search disks (Ctrl+F)"></button>
          <button class="square" id="settings-button" type="button" aria-label="Settings" title="Settings"></button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div id="message" class="message" role="status" hidden></div>
        <div id="screen"><div class="empty"><h2>Opening SpaceTrail</h2></div></div>
      </main>
    </div>
  </div>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="dialog-title"><h2 id="settings-title">Settings</h2><button type="button" class="square" id="close-settings" aria-label="Close settings"></button></div>
    <section class="setting">
      <h3>Scan location</h3>
      <p id="settings-location" class="path"></p>
      <p>Scan all local drives automatically or limit indexing to one folder.</p>
      <button type="button" id="all-drives" class="button" hidden>Scan all drives</button>
      <button type="button" id="change-location" class="button">Choose a folder…</button>
    </section>
    <section class="setting">
      <label class="check"><input type="checkbox" id="startup-setting"> Start background updates at sign-in</label>
      <p>SpaceTrail keeps the index up to date after you close the window.</p>
    </section>
  </dialog>
  <dialog id="preview" aria-labelledby="preview-title">
    <div class="dialog-title"><h2 id="preview-title">File preview</h2><button type="button" class="square" id="close-preview" aria-label="Close preview"></button></div>
    <p id="preview-name" class="preview-name"></p>
    <p id="preview-path" class="path"></p>
    <div id="preview-stage" class="preview-stage" role="status"></div>
    <button id="preview-reveal" class="button" type="button">Show in Explorer</button>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
